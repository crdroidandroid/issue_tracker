name: "🐞 Bug report"
description: "Report a problem with crDroid"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## crDroid bug report
        Before submitting, please [search existing issues](https://github.com/crdroidandroid/issue_tracker/issues?q=is%3Aissue+label%3Abug).
        
        ⚠️ **Unofficial builds are not supported**, since we can't verify device-specific sources.

  - type: input
    id: device
    attributes:
      label: Device
      description: "Format: **Device name (codename)**"
      placeholder: "Pixel 7 (panther)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: crDroid version / build date
      description: "Found in Settings → About phone → crDroid"
      placeholder: "12.5 / 2026-01-02"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: "Describe what happens and what you expected to happen instead."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Settings → crDroid settings
        2. Tap ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (logcat / build log)
      description: "Strongly recommended for crashes and functional bugs. Auto-formatted, no backticks needed."
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, videos, or extra context
      description: "Drag and drop files here. Add a suggested fix if you have one."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "I'm on an **official** build, running the latest version for my device from crdroid.net"
          required: true
        - label: "I searched existing issues and this isn't a duplicate"
          required: true
